<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TalentLens{% endblock %}</title>
  <style>
    :root {
      --bg:#f6f7fb; --card:#fff; --ink:#1b1f2a; --muted:#6b7280; --line:#e5e7ef;
      --brand:#4f46e5; --brand-ink:#fff; --good:#059669; --warn:#d97706; --bad:#dc2626;
      --chip:#eef0ff; --chip-ink:#3730a3;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1220; --card:#181c2e; --ink:#e8eaf3; --muted:#9aa3b8; --line:#2a2f47;
              --chip:#252a52; --chip-ink:#c7caff; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    header { background:var(--card); border-bottom:1px solid var(--line); }
    .wrap { max-width:1000px; margin:0 auto; padding:0 20px; }
    header .wrap { display:flex; align-items:center; justify-content:space-between; height:58px; }
    .logo { font-weight:700; letter-spacing:-.01em; font-size:18px; color:var(--ink); text-decoration:none; }
    .logo span { color:var(--brand); }
    .tag { color:var(--muted); font-size:13px; }
    main { padding:28px 0 60px; }
    h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.02em; }
    h2 { font-size:17px; margin:0 0 10px; }
    .sub { color:var(--muted); margin:0 0 22px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
    label { font-weight:600; display:block; margin-bottom:6px; }
    textarea, select, input[type=file] { width:100%; border:1px solid var(--line); border-radius:10px;
           background:var(--bg); color:var(--ink); padding:10px 12px; font:inherit; }
    textarea { min-height:220px; resize:vertical; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .btn { background:var(--brand); color:var(--brand-ink); border:0; border-radius:10px; padding:11px 20px;
           font:inherit; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .btn:hover { filter:brightness(1.08); }
    .chip { display:inline-block; background:var(--chip); color:var(--chip-ink); border-radius:999px;
            padding:2px 10px; font-size:12.5px; margin:2px 4px 2px 0; }
    .chip.ok { background:#d1fae5; color:#065f46; } .chip.miss { background:#fee2e2; color:#991b1b; }
    .chip.pref { background:#fef3c7; color:#92400e; }
    .err { background:#fee2e2; color:#7f1d1d; border-radius:10px; padding:10px 14px; margin-bottom:12px; }
    .note { background:#fef3c7; color:#78350f; border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:14px; }
    .muted { color:var(--muted); }
    .hint { font-size:13px; color:var(--muted); margin-top:6px; }

    .cand-head { display:flex; gap:16px; align-items:center; }
    .rank { width:40px; height:40px; border-radius:50%; background:var(--brand); color:#fff; display:grid;
            place-items:center; font-weight:700; flex:none; }
    .grow { flex:1; min-width:0; }
    .cand-head h2 { margin:0; }
    .score { text-align:right; }
    .score b { font-size:26px; letter-spacing:-.02em; }
    .verdict { font-size:12.5px; font-weight:600; }
    .v-strong { color:var(--good); } .v-good { color:#2563eb; } .v-partial { color:var(--warn); } .v-weak { color:var(--bad); }
    .bars { display:grid; gap:7px; margin:14px 0; }
    .bar { display:grid; grid-template-columns:130px 1fr 92px; gap:10px; align-items:center; font-size:13.5px; }
    .track { background:var(--line); border-radius:6px; height:9px; overflow:hidden; }
    .fill { background:var(--brand); height:100%; border-radius:6px; }
    ul.why { margin:6px 0 0 18px; padding:0; } ul.why li { margin:3px 0; }
    ul.warn li { color:var(--warn); }
    details summary { cursor:pointer; color:var(--brand); font-weight:600; margin-top:10px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:700px) { .grid2 { grid-template-columns:1fr; } .bar { grid-template-columns:100px 1fr 80px; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="logo" href="{{ url_for('main.index') }}">Talent<span>Lens</span></a>
    <span class="tag">AI recruitment &amp; CV screening</span>
  </div></header>
  <main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
